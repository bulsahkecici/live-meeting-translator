audio:
  input:
    name_substring: "MacBook Pro Mikrofonu"
    index_override: null
  output:
    name_substring: "BlackHole 2ch"
    index_override: null
  input_sample_rate: 16000
  output_sample_rate: 48000

vad:
  frame_duration_ms: 30
  silence_threshold_ms: 600
  min_speech_duration_ms: 800
  max_segment_duration_ms: 8000
  aggressiveness: 2

stt:
  backend: "mlx-whisper"
  model: "mlx-community/whisper-large-v3-turbo"
  language: "tr"
  beam_size: 1

translate:
  source_lang: "TR"
  target_lang: "EN"
  cache_size: 128
  timeout_seconds: 10
  retry_max_attempts: 3
  retry_backoff: [0.5, 1.0, 2.0, 4.0]

tts:
  engine: "edge"
  sample_rate: 48000
  channels: 1
  sapi:
    voice_substring: ""
  edge:
    voice: "en-US-GuyNeural"
    rate: "+0%"
    pitch: "+0Hz"

incoming_subtitles:
  enabled: true
  audio_input:
    name_substring: "BlackHole 16ch"
    index_override: null
    sample_rate: 48000
    channels: 2
    mix_to_mono: true
  vad:
    frame_duration_ms: 30
    silence_threshold_ms: 600
    min_speech_duration_ms: 800
    max_segment_duration_ms: 8000
    aggressiveness: 2
  stt:
    backend: "faster-whisper"
    model: "small"
    compute_type: "int8"
    device: "cpu"
    language: "en"
    beam_size: 1
  translate:
    backend: "deepl"
    source_lang: "EN"
    target_lang: "TR"
    cache_size: 128
    timeout_seconds: 10
    retry_max_attempts: 3
    retry_backoff: [0.5, 1.0, 2.0, 4.0]
  pipeline:
    audio_buffer_size: 14400
    stage_queue_capacity: 4
    enqueue_timeout_seconds: 2.0
    shutdown_timeout_seconds: 30.0

logging:
  level: "INFO"
  file: "logs/app.log"
  max_bytes: 10485760
  backup_count: 5
